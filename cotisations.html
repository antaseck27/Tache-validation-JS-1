<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotisations</title>
  <link rel="stylesheet" href="cotisations.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    .table-cotisation tbody td {
      color: #093545 !important;
    }
    .table-cotisation tbody tr:hover {
      background-color: #f3f4f6 !important;
      transition: background-color 0.2s ease-in-out;
    }
    .cursor-pointer { cursor: pointer; }

    .custom-card {
      padding: 1rem !important;
      font-size: 0.9rem;
      height: 120px;        
      width: 280px;
    }
    .row { display: flex; justify-content: center; gap: 40px; }
    .btn {
      width: 80px; height: 50px;
      background-color: rgb(241, 236, 236);
      border: none;
    }
    .btn:hover { background-color: #f3f4f6; }
    .bi { color: #20DF7F; }
    .modal-header{
      background-color: #20DF7F !important;
      color: #093545 !important;
    }
    .table2 thead th {
    background-color:#093545 !important;
    color:white !important;
    font-size: 12px;
    height: 40px;
    
    }

    .custom-modal {
     max-width: 1200px; /* largeur maximale */
     width: 80%;        /* largeur par défaut */
     height: 30vh;      /* hauteur du modal, 80% de la hauteur de la fenêtre */
    }

   .custom-modal .modal-content {
     height: 100%;      /* pour que le contenu prenne toute la hauteur */
    }
    .modal-body {
      max-height: 70vh;   /* hauteur maximale du corps du modal */
      overflow-y: auto;   /* ajoute une scrollbar verticale si besoin */
    }


    /* tableau d evolution */

    /* Tableau pour le modal */
.table-evolution {
  width: 90%;
  border-radius: 30px;
  background-color: white;
  box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
}

.table-evolution thead {
  background-color: #093545 !important; /* fond sombre */
  color: white !important;               /* texte blanc */
  font-size: 15px;
}

.table-evolution th,
.table-evolution td {
  padding: 0.75rem 1rem;
}

.table-evolution tbody td {
  color: #093545 !important;
}

.table-evolution tbody tr:hover {
  background-color: #f3f4f6 !important;
  transition: background-color 0.2s ease-in-out;
}

.table-evolution tbody td.statut {
  color: #20DF7F !important;
  font-weight: bold;
}
/* Colonne Statut (fond vert + texte blanc) */
.col-statut {
  color: #20DF7F !important;
  /* color: white !important; */
  /* font-weight: bold; */
  /* text-align: center; */
}
.progress-bar{
  background-color: #20DF7F !important;

}


  </style>
</head>
<body class="bg-light p-4">

  <!-- Bouton pour ouvrir le modal -->
  <!-- Bouton pour ouvrir le modal -->
<div class="d-flex justify-content-end mb-3 me-5">
  <button id="btncotisation" class="btn fw-bold me-5 rounded">
    <i class="bi bi-three-dots w-25"></i>
  </button>
</div>

<!-- Modal Bootstrap -->
<div class="modal fade" id="modalEvolution" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog  modal-dialog-centered custom-modal ">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cotisations termines</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="zoneEvolutionModal">
        <!-- Le tableau sera injecté ici -->
      </div>
    </div>
  </div>
</div>



    <div class="container mt-5">
    <div class="row">
      <div id="cardActifs" class="col-12 col-md-4 bg-white p-3 rounded shadow text-center cursor-pointer custom-card">
        <p class="fw-light text-start">Juin</p>
        <p class="fs-5 fw-bold text-start text-secondary">225.000 FCFA</p>
      </div>
      <div id="cardBloques" class="col-12 col-md-4 bg-white p-3 rounded shadow text-center cursor-pointer custom-card">
        <p class="fw-light text-start">Mai</p>
        <p class="fs-5 fw-bold text-start text-secondary">100.000 FCFA</p>
      </div>
      <div id="cardTotal" class="col-12 col-md-4 bg-white p-3 rounded shadow text-center cursor-pointer custom-card">
        <p class="fw-light text-start">Total Caisse</p>
        <p class="fs-5 fw-bold text-start text-secondary">3.500.000 FCFA</p>
        <div class="d-flex align-items-center gap-2 mt-2">
          <div class="progress flex-grow-1" style="height:5px;">
            <div class="progress-bar bg-success" style="width:77%;"></div>
          </div>
          <span class="small fw-semibold text-dark">77% Au seuil</span>
        </div>
      </div>
    </div>
  </div>
  <!-- Tableau membres actifs -->
  <div id="zoneActifs"></div>


 

 <script>
const membresActifs = [
  { nom: "Colle Fall", dateDeDebut: "01/01/2022", MontantCotise: "200.000 FCFA", MontantRestant: "100.000 FCFA" },
  { nom: "Anta Seck", dateDeDebut: "01/01/2022", MontantCotise: "200.000 FCFA", MontantRestant: "100.000 FCFA" },
  { nom: "Idrissa Gnigue", dateDeDebut: "01/01/2022", MontantCotise: "200.000 FCFA", MontantRestant: "100.000 FCFA"},
  { nom: "Ndeye Gnilane", dateDeDebut: "01/01/2022", MontantCotise: "200.000 FCFA", MontantRestant: "100.000 FCFA"},
  { nom: "Ahmed Cisse", dateDeDebut: "01/01/2022", MontantCotise: "200.000 FCFA", MontantRestant: "100.000 FCFA" },
  { nom: "Nogaye Ndao", dateDeDebut: "01/01/2022", MontantCotise: "200.000 FCFA", MontantRestant: "100.000 FCFA" },
];

const evolutionCotisation = [
  { nom: "Colle Fall", dateDeDebut: "01/01/2022", dateDeFin: "01/01/2022", MontantTotalCotise: "300.000 FCFA", statut: "Terminer" },
  { nom: "Anta Seck", dateDeDebut: "01/01/2022", dateDeFin: "01/01/2022", MontantTotalCotise: "300.000 FCFA", statut: "Terminer" },
  { nom: "Idrissa Gnigue", dateDeDebut: "01/01/2022", dateDeFin: "01/01/2022", MontantTotalCotise: "300.000 FCFA", statut: "Terminer" },
  { nom: "Ndeye Gnilane", dateDeDebut: "01/01/2022", dateDeFin: "01/01/2022", MontantTotalCotise: "300.000 FCFA", statut: "Terminer" },
  { nom: "Ahmed Cisse", dateDeDebut: "01/01/2022", dateDeFin: "01/01/2022", MontantTotalCotise: "300.000 FCFA", statut: "Terminer" },
  { nom: "Nogaye Ndao", dateDeDebut: "01/01/2022", dateDeFin: "01/01/2022", MontantTotalCotise: "300.000 FCFA", statut: "Terminer" },
];

// Affiche le premier tableau
function afficherMembresActifs() {
  let html = `<table class="table table-borderless bg-white shadow rounded-4 mt-5 table-cotisation" style="max-width:900px; margin:auto;">
    <thead>
      <tr>
        <th>Membres</th>
        <th>Date début</th>
        <th>Montant Cotisé</th>
        <th>Montant Restant</th>
        <th class="text-center">Actions</th>
      </tr>
    </thead>
    <tbody>`;
  membresActifs.forEach(m => {
    html += `<tr>
      <td>${m.nom}</td>
      <td>${m.dateDeDebut}</td>
      <td>${m.MontantCotise}</td>
      <td>${m.MontantRestant}</td>
      <td class="text-center"><i class="bi bi-eye text-dark cursor-pointer"></i></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  document.getElementById("zoneActifs").innerHTML = html;
}
document.addEventListener("DOMContentLoaded", afficherMembresActifs);

// Injecte le tableau d'évolution quand le modal s'ouvre
function afficherEvolutionCotisations() {
  let zone = document.getElementById("zoneEvolutionModal");
  let html = `<table class="table-evolution mx-auto mt-5">
    <thead>
      <tr>
        <th>Membres</th>
        <th>Date Début</th>
        <th>Date Fin</th>
        <th>Montant Total Cotisé</th>
        <th>Statut</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>`;
  evolutionCotisation.forEach(e => {
    html += `<tr>
      <td>${e.nom}</td>
      <td>${e.dateDeDebut}</td>
      <td>${e.dateDeFin}</td>
      <td>${e.MontantTotalCotise}</td>
      <td class="col-statut">${e.statut}</td>
      <td class="text-center">
        <i class="bi bi-eye text-dark me-2" title="Voir"></i>
      </td>
    </tr>`;
  });
  html += `</tbody></table>`;
  zone.innerHTML = html;
}


// Bouton ouvre le modal
document.getElementById("btncotisation").addEventListener("click", () => {
  afficherEvolutionCotisations(); // injecte avant d'ouvrir
  let modal = new bootstrap.Modal(document.getElementById('modalEvolution'));
  modal.show();
});

</script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
