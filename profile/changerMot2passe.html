<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="information.css">
    <title>changer mot de passe</title>
</head>
<body>
      <!-- section-2 (BOUTON EDITOR PROFILE) -->
    <section class="section-2">
          <div class="parametre-general p-5"> <h2>changer mot de passe</h2></div>
        <div class="row p-5 gap-5">
            <div class="col-lg-4 col-md-5 col-sm-12 border-end border-3 d-flex flex-column justify-content-start align-items-center">
                <p class="h5 mb-4 text-secondary opacity-75">Profil</p>
                 <img src="images/IM1.jpg" alt="" width="35%" height="135px"   class="rounded-circle p-2 photo">
                <strong class="h3">Faly Seck</strong>
                <span>Designer</span>
            </div>
            <div class="col-lg-5 col-md-5 col-sm-12">
                <strong>Modifier votre mot de passe</strong>
               
                    <div>
                        <label>Actuel mot de passe</label>
                        <input type="password" class="form-control" aria-label="Last name">
                    </div>

                    <div>
                        <label>Nouveau mot de passe</label>
                        <input type="password" class="form-control" aria-label="Last name">
                    </div>

                    <div>
                        <label>Confirmer mot de passe</label>
                        <input type="password" class="form-control" placeholder="Designer" aria-label="Last name" required>
                    </div>
                </div>
                 <div class="text-end"> <button class="btn btn-success text-white w-25">Mettre à jour</button>
           
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
