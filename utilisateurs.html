<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet"  href="utilisateurs.css">
  <title>Bakeli Tontine - Utilisateurs</title>
</head>
<body class="bg-light p-4">

  <!-- Cards -->
  <div class="row gap-5 mx-auto mb-5 py-5" style="max-width: 900px;">
    <div id="cardActifs" class="col cards1 bg-success p-4 rounded shadow text-center text-white cursor-pointer">
      <p class=" ">Membres Actifs</p>
      <p class="h4 fw-bold">94 Membres</p>
    </div>
    <div id="cardBloques" class="col cards2 bg-white p-4 rounded shadow text-center cursor-pointer">
      <p class=" paragraphe">Membres Bloqués <i class="bi bi-ban"></i></p>
      <p class="h4 fw-bold  paragraphe">6 Membres</p>
    </div>
    <div id="cardTotal" class="col cards3 bg-white p-4 rounded shadow text-center cursor-pointer">
      <p class=" paragraphe">Total Effectif</p>
      <p class="h4 fw-bold  paragraphe">100 Membres</p>
    </div>
  </div>

  <!-- Bouton Ajouter -->
  <div class="d-flex justify-content-end mb-3 me-5">
    <button id="btnAjouter" class="btn btn-dark fw-bold me-5 rounded">
      Ajouter
    </button>
  </div>

  <!-- Zone Tableau -->
  <div id="zoneTableau"></div>

  <!-- Modal Formulaire -->
  <div id="modalForm" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none justify-content-center align-items-start pt-5 py-5 mt-5 z-3">
    <div class="bg-white p-4 rounded shadow w-100" style="max-width: 700px; position: relative;">
      <button id="btnFermer" class="btn-close position-absolute top-0 end-0 m-3"></button>
      <form id="formMembre" class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Nom</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Prénom</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Date de naissance</label>
          <input type="date" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Profession</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Téléphone</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Adresse</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Organisation</label>
          <input type="text" class="form-control" required>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-success w-100">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  
 
  <script src="utilisateurs.js"></script>
</body>
</html>
